[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracewatch"
version = "1.0.0"
description = "Système de veille à preuves traçables (thème 5 : agents autonomes LLM)"
requires-python = ">=3.11"
# Les dépendances sont listées dans requirements.txt (source unique).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
