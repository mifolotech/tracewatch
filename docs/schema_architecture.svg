<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>TraceWatch : schéma d'architecture</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .boite { fill: #ffffff; stroke: #c9c7c0; stroke-width: 1.5; }
      .cle { fill: #eaf2fc; stroke: #2a78d6; stroke-width: 2; }
      .rejet { fill: #fdeeee; stroke: #e34948; stroke-width: 1.5; }
      .stock { fill: #f4f3ef; stroke: #8a8880; stroke-width: 1.5; }
      .titre { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
      .texte { font-size: 12px; fill: #52514e; }
      .etape { font-size: 11px; font-weight: 600; fill: #2a78d6; letter-spacing: 0.04em; }
      .lien { stroke: #52514e; stroke-width: 1.5; fill: none; marker-end: url(#fleche); }
      .pointille { stroke: #8a8880; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0b0b0b">TraceWatch : de la question de veille à une recommandation traçable</text>
  <text x="30" y="62" class="texte">L'IA propose, le code vérifie : seule une affirmation dont la citation figure mot pour mot dans le document devient une preuve.</text>

  <!-- Profil -->
  <rect x="30" y="95" width="160" height="70" rx="8" class="stock"/>
  <text x="45" y="122" class="titre">Profil de veille</text>
  <text x="45" y="142" class="texte">question, mots-clés,</text>
  <text x="45" y="157" class="texte">sources, poids (YAML)</text>

  <!-- Ligne du pipeline -->
  <rect x="230" y="95" width="160" height="70" rx="8" class="boite"/>
  <text x="245" y="114" class="etape">ÉTAPE 3</text>
  <text x="245" y="134" class="titre">Collecte</text>
  <text x="245" y="152" class="texte">5 familles, 1 337 docs</text>

  <rect x="430" y="95" width="160" height="70" rx="8" class="boite"/>
  <text x="445" y="114" class="etape">ÉTAPE 4</text>
  <text x="445" y="134" class="titre">Dédoublonnage</text>
  <text x="445" y="152" class="texte">1 cluster = 1 source</text>

  <rect x="630" y="95" width="160" height="70" rx="8" class="boite"/>
  <text x="645" y="114" class="etape">ÉTAPE 5</text>
  <text x="645" y="134" class="titre">Scoring</text>
  <text x="645" y="152" class="texte">3 scores séparés</text>

  <path d="M190,130 L226,130" class="lien"/>
  <path d="M390,130 L426,130" class="lien"/>
  <path d="M590,130 L626,130" class="lien"/>
  <path d="M790,130 L840,130 L840,235 L796,235" class="lien"/>

  <!-- Analyse -->
  <rect x="630" y="200" width="160" height="70" rx="8" class="boite"/>
  <text x="645" y="219" class="etape">ÉTAPE 6</text>
  <text x="645" y="239" class="titre">Analyse IA</text>
  <text x="645" y="257" class="texte">affirmation + citation</text>

  <rect x="850" y="290" width="120" height="60" rx="8" class="stock"/>
  <text x="865" y="315" class="titre">LLM Gemini</text>
  <text x="865" y="335" class="texte">+ cache JSON</text>
  <path d="M790,255 L880,255 L880,286" class="pointille"/>

  <!-- Vérification -->
  <rect x="430" y="200" width="160" height="70" rx="8" class="cle"/>
  <text x="445" y="219" class="etape">GARDE-FOU</text>
  <text x="445" y="239" class="titre">Vérification</text>
  <text x="445" y="257" class="texte">citation mot pour mot ?</text>
  <path d="M630,235 L594,235" class="lien"/>

  <rect x="430" y="310" width="160" height="50" rx="8" class="rejet"/>
  <text x="445" y="332" class="titre">Rejetée</text>
  <text x="445" y="350" class="texte">gardée pour audit</text>
  <path d="M510,270 L510,306" class="lien"/>
  <text x="518" y="292" class="texte">non</text>

  <!-- Preuves -->
  <rect x="230" y="200" width="160" height="70" rx="8" class="cle"/>
  <text x="245" y="219" class="etape">ÉTAPES 6-7</text>
  <text x="245" y="239" class="titre">Preuves [Pn]</text>
  <text x="245" y="257" class="texte">contradictions, niveau</text>
  <path d="M430,235 L394,235" class="lien"/>
  <text x="402" y="228" class="texte">oui</text>

  <!-- Rapport -->
  <rect x="30" y="200" width="160" height="70" rx="8" class="boite"/>
  <text x="45" y="219" class="etape">ÉTAPE 8</text>
  <text x="45" y="239" class="titre">Rapport traçable</text>
  <text x="45" y="257" class="texte">décision + révisions</text>
  <path d="M230,235 L194,235" class="lien"/>

  <!-- Tableau de bord + base -->
  <rect x="30" y="310" width="160" height="60" rx="8" class="boite"/>
  <text x="45" y="335" class="titre">Tableau de bord</text>
  <text x="45" y="355" class="texte">Streamlit, 6 onglets</text>
  <path d="M110,270 L110,306" class="lien"/>

  <rect x="230" y="310" width="160" height="60" rx="8" class="stock"/>
  <text x="245" y="335" class="titre">SQLite</text>
  <text x="245" y="355" class="texte">contrat de données</text>

  <!-- Chaîne de traçabilité -->
  <rect x="30" y="410" width="940" height="120" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.5"/>
  <text x="50" y="438" class="etape">CHAÎNE DE TRAÇABILITÉ (SCÉNARIO 5)</text>
  <rect x="50" y="455" width="190" height="52" rx="6" class="boite"/>
  <text x="62" y="477" class="titre">Phrase du rapport</text>
  <text x="62" y="495" class="texte">« … surestiment [P45] »</text>
  <rect x="285" y="455" width="190" height="52" rx="6" class="cle"/>
  <text x="297" y="477" class="titre">Preuve P45</text>
  <text x="297" y="495" class="texte">citation exacte vérifiée</text>
  <rect x="520" y="455" width="190" height="52" rx="6" class="boite"/>
  <text x="532" y="477" class="titre">Document cité</text>
  <text x="532" y="495" class="texte">URL, source, date</text>
  <rect x="755" y="455" width="195" height="52" rx="6" class="boite"/>
  <text x="767" y="477" class="titre">Document original</text>
  <text x="767" y="495" class="texte">si c'est une republication</text>
  <path d="M240,481 L281,481" class="lien"/>
  <path d="M475,481 L516,481" class="lien"/>
  <path d="M710,481 L751,481" class="lien"/>
</svg>
